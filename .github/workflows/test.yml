name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install bats and bash 5 (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core bash

      - name: Show bash versions
        run: |
          bash --version | head -n1
          /bin/bash --version | head -n1

      # macOS's /bin/bash is 3.2: the scripts must refuse it with a clear message.
      - name: Old bash is rejected (macOS)
        if: runner.os == 'macOS'
        run: |
          if out=$(/bin/bash bin/rcode --version 2>&1); then echo "expected failure"; exit 1; fi
          echo "$out" | grep -q 'bash >= 5 is required'

      - name: Run tests
        run: bats test/
