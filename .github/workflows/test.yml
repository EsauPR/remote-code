name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core

      - name: Show bash versions
        run: |
          bash --version | head -n1
          /bin/bash --version | head -n1

      # On macOS, /bin/bash is 3.2 (what users get with `#!/usr/bin/env bash`
      # unless they installed a newer one). Put it first so the tests exercise it.
      - name: Run tests
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="/bin:$PATH"; fi
          bats test/
